# Publica la app en GitHub Pages cada vez que hay cambios en la rama main.
# La app compilada se sube a la rama gh-pages. En GitHub:
#   Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root)
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY (valores públicos).
# Sin esas variables la app funciona en «modo local de prueba».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Publicar en la rama gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
