# Configura Supabase sin usar la terminal: crea/actualiza las tablas, genera la
# clave de cifrado de los datos de salud (solo la primera vez) y publica las
# Edge Functions. Ver README, paso 3.
# Necesita en GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   Variables: SUPABASE_PROJECT_REF
name: Configurar Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  supabase:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Revisar los datos (sin mostrarlos)
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          # Quita espacios o saltos de línea pegados por error al copiar
          tok="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          ref="$(printf '%s' "$RAW_REF" | tr -d '[:space:]')"
          ok=true
          if [ -z "$tok" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN."; ok=false
          elif [[ "$tok" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN no empieza por 'sbp_' (empieza por '${tok:0:4}'). Debe ser el token de supabase.com/dashboard/account/tokens, no la Publishable key ni la Secret key."; ok=false
          elif ! [[ "$tok" =~ ^sbp_[A-Za-z0-9]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN tiene caracteres de más (comillas, flechas, la palabra 'valor', etc.). Pega solo el token."; ok=false
          fi
          if ! [[ "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::La variable SUPABASE_PROJECT_REF debe ser el Project ID de 20 letras y números (Supabase → Project Settings → General). Tiene ${#ref} caracteres."; ok=false
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_PASSWORD."; ok=false
          fi
          $ok || exit 1
          echo "::add-mask::$tok"
          echo "SUPABASE_ACCESS_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "Datos con formato correcto."
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Crear o actualizar las tablas
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Secretos de las funciones
        run: |
          if ! supabase secrets list --project-ref "$PROJECT_REF" | grep -q HEALTH_ENCRYPTION_KEY; then
            echo "Generando la clave de cifrado de datos de salud (solo esta vez)"
            supabase secrets set --project-ref "$PROJECT_REF" HEALTH_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          fi
          supabase secrets set --project-ref "$PROJECT_REF" APP_ORIGIN="https://${{ github.repository_owner }}.github.io"
      - name: Publicar Edge Functions
        run: |
          supabase functions deploy health-crypto --project-ref "$PROJECT_REF"
          supabase functions deploy account-delete --project-ref "$PROJECT_REF"
