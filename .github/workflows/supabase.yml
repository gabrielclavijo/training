# Configura Supabase sin usar la terminal: crea/actualiza las tablas, genera la
# clave de cifrado de los datos de salud (solo la primera vez) y publica las
# Edge Functions. Ver README, paso 3.
# Necesita en GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   Variables: SUPABASE_PROJECT_REF
name: Configurar Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  supabase:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Crear o actualizar las tablas
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Secretos de las funciones
        run: |
          if ! supabase secrets list --project-ref "$PROJECT_REF" | grep -q HEALTH_ENCRYPTION_KEY; then
            echo "Generando la clave de cifrado de datos de salud (solo esta vez)"
            supabase secrets set --project-ref "$PROJECT_REF" HEALTH_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          fi
          supabase secrets set --project-ref "$PROJECT_REF" APP_ORIGIN="https://${{ github.repository_owner }}.github.io"
      - name: Publicar Edge Functions
        run: |
          supabase functions deploy health-crypto --project-ref "$PROJECT_REF"
          supabase functions deploy account-delete --project-ref "$PROJECT_REF"
