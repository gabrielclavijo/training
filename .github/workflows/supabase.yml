# Configura Supabase sin usar la terminal: crea/actualiza las tablas, genera la
# clave de cifrado de los datos de salud (solo la primera vez) y publica las
# Edge Functions. Ver README, paso 3.
# Necesita en GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   Variables: SUPABASE_PROJECT_REF
# Para Strava (opcional, ver README): variable STRAVA_CLIENT_ID y secreto STRAVA_CLIENT_SECRET
name: Configurar Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  supabase:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STRAVA_CLIENT_ID: ${{ vars.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Revisar los datos (sin mostrarlos)
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          # Quita espacios o saltos de línea pegados por error al copiar
          tok="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          ref="$(printf '%s' "$RAW_REF" | tr -d '[:space:]')"
          ok=true
          if [ -z "$tok" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN."; ok=false
          elif [[ "$tok" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN no empieza por 'sbp_' (empieza por '${tok:0:4}'). Debe ser el token de supabase.com/dashboard/account/tokens, no la Publishable key ni la Secret key."; ok=false
          elif ! [[ "$tok" =~ ^sbp_[A-Za-z0-9]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN tiene caracteres de más (comillas, flechas, la palabra 'valor', etc.). Pega solo el token."; ok=false
          fi
          if ! [[ "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::La variable SUPABASE_PROJECT_REF debe ser el Project ID de 20 letras y números (Supabase → Project Settings → General). Tiene ${#ref} caracteres."; ok=false
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_PASSWORD."; ok=false
          fi
          $ok || exit 1
          echo "::add-mask::$tok"
          echo "SUPABASE_ACCESS_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "Datos con formato correcto."
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Crear o actualizar las tablas
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
      - name: Secretos de las funciones
        run: |
          if ! supabase secrets list --project-ref "$PROJECT_REF" | grep -q HEALTH_ENCRYPTION_KEY; then
            echo "Generando la clave de cifrado de datos de salud (solo esta vez)"
            supabase secrets set --project-ref "$PROJECT_REF" --yes HEALTH_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          fi
          supabase secrets set --project-ref "$PROJECT_REF" --yes APP_ORIGIN="https://${{ github.repository_owner }}.github.io"
      - name: Publicar Edge Functions
        run: |
          supabase functions deploy health-crypto --project-ref "$PROJECT_REF" --yes
          supabase functions deploy account-delete --project-ref "$PROJECT_REF" --yes
      - name: Strava (si está configurado)
        if: ${{ vars.STRAVA_CLIENT_ID != '' }}
        run: |
          set -e
          if [ -z "$STRAVA_CLIENT_SECRET" ]; then echo "::error::Falta el secreto STRAVA_CLIENT_SECRET."; exit 1; fi
          echo "::add-mask::$STRAVA_CLIENT_SECRET"
          existing="$(supabase secrets list --project-ref "$PROJECT_REF")"
          if ! grep -q STRAVA_VERIFY_TOKEN <<<"$existing"; then
            VERIFY="$(openssl rand -hex 16)"
            supabase secrets set --project-ref "$PROJECT_REF" --yes STRAVA_VERIFY_TOKEN="$VERIFY"
          fi
          supabase secrets set --project-ref "$PROJECT_REF" --yes STRAVA_CLIENT_ID="$STRAVA_CLIENT_ID" STRAVA_CLIENT_SECRET="$STRAVA_CLIENT_SECRET"
          supabase functions deploy strava-connect --project-ref "$PROJECT_REF" --yes
          supabase functions deploy strava-sync --project-ref "$PROJECT_REF" --yes
          supabase functions deploy strava-disconnect --project-ref "$PROJECT_REF" --yes
          supabase functions deploy strava-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Strava - registrar el webhook (una vez por app)
        if: ${{ vars.STRAVA_CLIENT_ID != '' }}
        run: |
          set -e
          CALLBACK="https://${PROJECT_REF}.supabase.co/functions/v1/strava-webhook"
          subs="$(curl -s "https://www.strava.com/api/v3/push_subscriptions?client_id=${STRAVA_CLIENT_ID}&client_secret=${STRAVA_CLIENT_SECRET}")"
          echo "Suscripciones actuales: $(echo "$subs" | jq -c '[.[] | {id, callback_url}]' 2>/dev/null || echo "$subs")"
          id="$(echo "$subs" | jq -r --arg cb "$CALLBACK" '.[]? | select(.callback_url == $cb) | .id' | head -1)"
          if [ -z "$id" ]; then
            # Si hay otra suscripción (con otra dirección) se reemplaza: Strava permite una por app
            old="$(echo "$subs" | jq -r '.[]?.id' | head -1)"
            if [ -n "$old" ]; then curl -s -X DELETE "https://www.strava.com/api/v3/push_subscriptions/${old}?client_id=${STRAVA_CLIENT_ID}&client_secret=${STRAVA_CLIENT_SECRET}"; fi
            # El token de verificación vive solo en Supabase: se genera uno nuevo para esta suscripción
            VERIFY="$(openssl rand -hex 16)"
            supabase secrets set --project-ref "$PROJECT_REF" --yes STRAVA_VERIFY_TOKEN="$VERIFY"
            sleep 20  # que la función tome el secreto nuevo
            res="$(curl -s -X POST https://www.strava.com/api/v3/push_subscriptions \
              --form-string client_id="$STRAVA_CLIENT_ID" --form-string client_secret="$STRAVA_CLIENT_SECRET" \
              --form-string callback_url="$CALLBACK" --form-string verify_token="$VERIFY")"
            id="$(echo "$res" | jq -r '.id // empty')"
            if [ -z "$id" ]; then echo "::error::Strava no aceptó el webhook: $res"; exit 1; fi
          fi
          supabase secrets set --project-ref "$PROJECT_REF" --yes STRAVA_SUBSCRIPTION_ID="$id"
          echo "Webhook de Strava activo (suscripción $id)."
