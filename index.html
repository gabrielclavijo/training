<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Centraliza tus entrenamientos, mira tu forma física y planea tu temporada." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Entreno</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un destello de color.
      try {
        var t = localStorage.getItem('entreno.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
